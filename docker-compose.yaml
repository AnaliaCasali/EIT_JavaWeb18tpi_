
services:
  # 1. Servicio de la Base de Datos (MySQL)
  gamer-db:
    image: mysql:8.0
    container_name: gamermatch_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: gamermatch_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Mapeamos la carpeta que contiene a init.sql
      - ./src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - gamer-network

  # 2. Servicio de tu Aplicación Java (Web)
  gamer-app:
    build: .
    image: gamer-app:latest
    container_name: gamer_java_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://gamer-db:3306/gamermatch_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    depends_on:
      - gamer-db
    networks:
      - gamer-network

volumes:
  mysql_data:

networks:
  gamer-network:
    driver: bridge